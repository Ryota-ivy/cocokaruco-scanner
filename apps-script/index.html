<script>

let scanner = null;
let scannerStarting = false;
let currentMode = "register";
let currentSaleBarcode = "";

function setMode(mode) {
  currentMode = mode;
  const sale = mode === "sale";
  document.getElementById("registerFields").style.display = sale ? "none" : "block";
  document.getElementById("salePanel").style.display = sale ? "block" : "none";
  document.getElementById("registerModeBtn").style.background = sale ? "#e5e5e5" : "#111";
  document.getElementById("registerModeBtn").style.color = sale ? "#111" : "#fff";
  document.getElementById("saleModeBtn").style.background = sale ? "#111" : "#e5e5e5";
  document.getElementById("saleModeBtn").style.color = sale ? "#fff" : "#111";
  document.getElementById("saleInfo").style.display = "none";
  document.getElementById("sellButton").style.display = "none";
  currentSaleBarcode = "";
}

async function startScanner(readerId, scanMode) {
  if (scanner || scannerStarting) return;

  const targetReaderId = readerId || "reader";
  const targetMode = scanMode || currentMode;
  const reader = document.getElementById(targetReaderId);
  if (!reader) {
    alert("カメラ表示エリアが見つかりませんでした。ページを再読み込みしてください。");
    return;
  }

  // 販売モードは内側に余白があり、固定300pxの読み取り枠だと
  // iPhoneで表示領域を超えて起動に失敗するため、実際の横幅に合わせる。
  const availableWidth = reader.clientWidth || reader.parentElement.clientWidth || window.innerWidth;
  const qrWidth = Math.max(180, Math.min(280, Math.floor(availableWidth * 0.82)));
  const qrHeight = Math.max(100, Math.floor(qrWidth * 0.5));
  let scanHandled = false;

  scannerStarting = true;
  reader.innerHTML = "";

  try {
    const activeScanner = new Html5Qrcode(targetReaderId);
    scanner = activeScanner;

    await activeScanner.start(
      { facingMode: { ideal: "environment" } },
      {
        fps: 15,
        qrbox: { width: qrWidth, height: qrHeight }
      },
      async function(decodedText) {
        if (scanHandled) return;
        scanHandled = true;

        try {
          await activeScanner.stop();
        } catch (stopError) {
          console.warn("カメラ停止エラー:", stopError);
        }

        try {
          activeScanner.clear();
        } catch (clearError) {
          console.warn("カメラ表示のクリアエラー:", clearError);
        }

        if (scanner === activeScanner) scanner = null;
        reader.innerHTML = "";

        if (targetMode === "sale") {
          currentSaleBarcode = decodedText;
          loadSaleProduct(decodedText);
        } else {
          document.getElementById("barcode").value = decodedText;
        }
      },
      function() {
        // 読み取り待機中
      }
    );
  } catch (err) {
    console.error("カメラ起動エラー:", err);
    if (scanner) {
      try { scanner.clear(); } catch (clearError) {}
    }
    scanner = null;
    reader.innerHTML = "";
    alert("カメラを起動できませんでした。ページを再読み込みして、もう一度お試しください。");
  } finally {
    scannerStarting = false;
  }
}


function loadSaleProduct(barcode) {
  const info = document.getElementById("saleInfo");
  const btn = document.getElementById("sellButton");
  info.style.display = "block";
  info.textContent = "商品情報を確認中...";
  btn.style.display = "none";
  google.script.run
    .withSuccessHandler(function(p) {
      if (!p.found) {
        info.textContent = "❌ このバーコードの商品が見つかりません";
        currentSaleBarcode = "";
        return;
      }
      info.innerHTML =
        "<strong>" + (p.brand || "") + " " + (p.productName || "") + "</strong><br>" +
        "カラー：" + (p.color || "-") + "　サイズ：" + (p.size || "-") + "<br>" +
        "販売価格：¥" + Number(p.price || 0).toLocaleString() + "<br>" +
        "現在庫：<strong>" + p.stock + "</strong>";
      if (p.stock > 0) btn.style.display = "block";
      else info.innerHTML += "<br><strong>⚠️ 在庫0のため販売できません</strong>";
    })
    .withFailureHandler(function(e) { info.textContent = "❌ " + e.message; })
    .getProductForSale(barcode);
}

function confirmSale() {
  if (!currentSaleBarcode) return;
  const btn = document.getElementById("sellButton");
  btn.disabled = true;
  btn.textContent = "処理中...";
  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false;
      btn.textContent = "この商品を1点販売する";
      if (!r.success) {
        if (r.reason === "out_of_stock") alert("在庫が0のため販売できません");
        else alert("商品が見つかりませんでした");
        return;
      }
      document.getElementById("saleInfo").innerHTML =
        "✅ <strong>販売登録しました！</strong><br>" +
        (r.brand || "") + " " + (r.productName || "") + "<br>" +
        "販売後在庫：<strong>" + r.newStock + "</strong>";
      btn.style.display = "none";
      currentSaleBarcode = "";
      if (navigator.vibrate) navigator.vibrate(80);
    })
    .withFailureHandler(function(e) {
      btn.disabled = false;
      btn.textContent = "この商品を1点販売する";
      alert("販売処理エラー：" + e.message);
    })
    .sellProductByBarcode(currentSaleBarcode);
}

function generateBarcodeNow() {
  const btn = document.getElementById("generateBarcodeButton");
  const message = document.getElementById("message");
  btn.disabled = true;
  btn.textContent = "生成中...";
  message.textContent = "";

  google.script.run
    .withSuccessHandler(function(code) {
      document.getElementById("barcode").value = code;
      JsBarcode("#previewBarcode", code, {
        format: "EAN13",
        displayValue: true,
        height: 48,
        width: 1.5,
        margin: 10,
        fontSize: 13,
        background: "#ffffff",
        lineColor: "#000000"
      });
      document.getElementById("barcodePreview").style.display = "block";
      document.getElementById("autoBarcodeNotice").style.display = "block";
      btn.disabled = false;
      btn.textContent = "🔄 別のバーコードを生成";
      message.textContent = "✅ 未使用のバーコードを生成しました";
    })
    .withFailureHandler(function(error) {
      btn.disabled = false;
      btn.textContent = "🏷️ 新しいバーコードを生成";
      message.textContent = "❌ バーコード生成エラー：" + error.message;
    })
    .generateUniqueEan13Barcode();
}

function validateEan13(value) {
  const code = String(value || "").trim();
  if (!/^\d{13}$/.test(code)) {
    return { valid: false, message: "バーコード番号は13桁の数字で入力してください。" };
  }

  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
  }
  const expectedCheckDigit = (10 - (sum % 10)) % 10;
  if (Number(code[12]) !== expectedCheckDigit) {
    return { valid: false, message: "EAN-13のチェックデジットが正しくありません。番号を確認してください。" };
  }

  return { valid: true, code: code };
}

function canvasToPngBlob(canvas) {
  const dataUrl = canvas.toDataURL("image/png");
  const binary = atob(dataUrl.split(",")[1]);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: "image/png" });
}

async function saveBarcodeImage() {
  const button = document.getElementById("saveBarcodeButton");
  const status = document.getElementById("barcodeSaveMessage");
  const validation = validateEan13(document.getElementById("barcode").value);

  if (!validation.valid) {
    status.textContent = "⚠️ " + validation.message;
    document.getElementById("barcode").focus();
    return;
  }

  button.disabled = true;
  button.textContent = "画像を作成中...";
  status.textContent = "";

  try {
    const canvas = document.createElement("canvas");
    JsBarcode(canvas, validation.code, {
      format: "EAN13",
      displayValue: true,
      width: 5,
      height: 300,
      margin: 60,
      fontSize: 42,
      textMargin: 16,
      fontOptions: "bold",
      background: "#ffffff",
      lineColor: "#000000"
    });

    // 同期生成して、iPhone Safariの共有操作に必要なタップ状態を保つ。
    const blob = canvasToPngBlob(canvas);
    const fileName = "barcode-" + validation.code + ".png";
    const file = new File([blob], fileName, { type: "image/png" });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: "バーコード " + validation.code
      });
      status.textContent = "✅ 共有先を選択しました。";
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      status.textContent = "✅ PNG画像を保存しました。";
    }
  } catch (error) {
    if (error && error.name === "AbortError") {
      status.textContent = "共有をキャンセルしました。";
    } else {
      status.textContent = "❌ 画像を保存できませんでした：" + (error.message || error);
    }
  } finally {
    button.disabled = false;
    button.textContent = "📱 バーコード画像を保存・共有";
  }
}

function registerProduct() {

  const button = document.getElementById("registerButton");
  const message = document.getElementById("message");

  const data = {
    productNumber: document.getElementById("productNumber").value,
    barcode: document.getElementById("barcode").value,
    generateBarcode: document.getElementById("barcode").value.trim() === "",
    productName: document.getElementById("productName").value,
    type: document.getElementById("type").value,
    brand: document.getElementById("brand").value,
    color: document.getElementById("color").value,
    size: document.getElementById("size").value,
    maker: document.getElementById("maker").value,
    arrivalDate: document.getElementById("arrivalDate").value,
    cost: document.getElementById("cost").value,
    price: document.getElementById("price").value,
    stock: document.getElementById("stock").value,
    instagram: document.getElementById("instagram").value
  };

  if (!data.productName) {
    alert("商品名を入力してください");
    return;
  }

  button.disabled = true;
  button.textContent = "登録中...";
  message.textContent = "";

  google.script.run

 .withSuccessHandler(function(result) {

  message.textContent = "✅ " + (result.message || result);
  button.disabled = false;
  button.textContent = "商品を登録する";

  if (result && result.barcode) {
    document.getElementById("barcode").value = result.barcode;
    showProductLabel(result);
    return;
  }

  // 登録完了後、次の商品スキャン画面へ自動移動
  setTimeout(function() {
    window.location.href =
      "https://ryota-ivy.github.io/cocokaruco-scanner/";
  }, 800);

})

    .withFailureHandler(function(error) {

      message.textContent = "❌ 登録できませんでした：" + error.message;

      button.disabled = false;
      button.textContent = "商品を登録する";

    })

    .registerProduct(data);
}

function showProductLabel(result) {
  const d = result.product || {};
  const taxIn = Number(d.price || 0);
  const taxOut = Math.round(taxIn / 1.1);
  document.getElementById("labelBrand").textContent = d.brand || "cocokaruco";
  document.getElementById("labelMeta").textContent =
    "品番：" + (d.productNumber || "-") +
    "　カラー：" + (d.color || "-") +
    "　サイズ：" + (d.size || "-");
  document.getElementById("labelPrice").textContent =
    "税込 ¥" + taxIn.toLocaleString() + "（税抜 ¥" + taxOut.toLocaleString() + "）";
  JsBarcode("#labelBarcode", result.barcode, {
    format: "EAN13", displayValue: true, height: 48, width: 1.5,
    margin: 10, fontSize: 13, background: "#ffffff", lineColor: "#000000"
  });
  document.getElementById("generatedLabel").style.display = "block";
  document.getElementById("generatedLabel").scrollIntoView({behavior:"smooth"});
}

// 登録済みバーコードをチェック
window.addEventListener("DOMContentLoaded", function () {

  const barcodeInput = document.getElementById("barcode");
  const params = new URLSearchParams(window.location.search);
  const isNewBarcode = params.get("newBarcode") === "1";

    barcodeInput.placeholder = "下のボタンで自動生成できます";
    document.getElementById("autoBarcodeNotice").style.display = "block";
  }

  const barcode = barcodeInput.value.trim();
  if (!barcode) return;

  google.script.run
    .withSuccessHandler(function(info) {

      if (!info.found) {
        return;
      }

     currentDuplicateBarcode = barcode;

document.getElementById("duplicateInfo").innerHTML =
  "商品名：" + info.productName + "<br>" +
  "ブランド：" + info.brand + "<br>" +
  "カラー：" + info.color + "<br>" +
  "サイズ：" + info.size + "<br>" +
  "現在庫：" + info.stock + "<br>" +
  "登録件数：" + info.count + "件";

document.getElementById("duplicateModal").style.display = "flex";
    })
    .withFailureHandler(function(error) {
      console.error("バーコード確認エラー:", error);
    })
    .checkBarcode(barcode);

});

let currentDuplicateBarcode = "";

function addExistingStock() {
  google.script.run
    .withSuccessHandler(function(result) {

      if (result.success) {
        alert("在庫を＋1しました！ 現在庫：" + result.newStock);

        window.location.href =
          "https://ryota-ivy.github.io/cocokaruco-scanner/";
      } else {
        alert("在庫更新に失敗しました");
      }

    })
    .withFailureHandler(function(error) {
      alert("在庫更新エラー：" + error.message);
    })
    .addStockByBarcode(currentDuplicateBarcode);
}

}


function cancelDuplicate() {
