name: Deploy Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps-script

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Validate deployment secrets
        shell: bash
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASP_CREDENTIALS" || { echo "CLASP_CREDENTIALS is missing"; exit 1; }
          test -n "$SCRIPT_ID" || { echo "APPS_SCRIPT_ID is missing"; exit 1; }

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"

      - name: Configure Apps Script project
        shell: bash
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json

      - name: Verify clasp login
        run: clasp login --status

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Create Apps Script version
        id: version
        shell: bash
        run: |
          OUTPUT="$(clasp version "GitHub ${GITHUB_SHA}")"
          echo "$OUTPUT"
          VERSION="$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9]+' | tail -1)"
          test -n "$VERSION" || { echo "Could not determine Apps Script version"; exit 1; }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update existing web app deployment
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          DEPLOYMENT_ID="$(clasp deployments | awk '/@HEAD/ {next} /AKfy/ {print $2; exit}')"
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "No existing web app deployment found; creating one."
            clasp deploy --versionNumber "$VERSION" --description "GitHub ${GITHUB_SHA}"
          else
            echo "Updating deployment $DEPLOYMENT_ID to version $VERSION"
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --versionNumber "$VERSION" --description "GitHub ${GITHUB_SHA}"
          fi
