<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>cocokaruco Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }

    .no-barcode {
      background: #fff;
      color: #111;
      border: 2px solid #111;
      margin-top: 12px;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 16px;
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .home-actions { display: grid; gap: 14px; }
    .home-actions button { min-height: 104px; margin-top: 0; text-align: left; padding: 20px; }
    .home-actions button span { display: block; font-size: 14px; font-weight: 500; margin-top: 8px; opacity: .78; }
    .sale-button { background: #0b6bcb; }
    .back-button { background: #fff; color: #111; border: 1px solid #ccc; margin: 0 0 16px; }
    @media (max-width: 520px) {
      body { padding: 12px; }
      .container { padding: 18px; border-radius: 14px; }
      button { min-height: 52px; }
    }
    @media print {
      body * { visibility: hidden; }
      #barcodeMaker, #barcodeMaker * { visibility: visible; }
      #barcodeMaker { position:absolute; left:0; top:0; width:40mm; height:20mm; box-sizing:border-box; border:0; padding:1mm; margin:0; overflow:hidden; }
      #barcodeMaker > div:first-child { font-size:10px; line-height:1.1; }
      #newBarcodeSvg { max-width:36mm !important; height:auto !important; display:block; margin:0 auto; }
      #newBarcodeText { display:none !important; }
      #barcodeMaker button { display:none; }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>cocokaruco</h1>
  <div class="sub">BARCODE SCANNER</div>

  <div id="homeScreen" class="screen active">
    <div class="home-actions">
      <button onclick="openRegistration()">
        📦 商品登録
        <span>バーコードあり／なしの商品を在庫へ登録</span>
      </button>
      <button class="sale-button" onclick="openSales()">
        🛒 商品販売
        <span>カメラで商品を読み取り、数量を確認して販売</span>
      </button>
    </div>
  </div>

  <div id="scannerScreen" class="screen">
    <button class="back-button" onclick="showHome()">← トップへ戻る</button>

    <h2 id="scannerTitle" style="text-align:center;">商品登録</h2>

    <button onclick="startScanner(currentScanMode)">
      📷 バーコードを読み取る
    </button>

    <button id="noBarcodeButton" class="no-barcode" onclick="registerWithoutBarcode()">
      🏷️ バーコードがない商品を登録
    </button>

  <div id="reader"></div>

  <div id="message">
    商品のバーコードをカメラに映してください
  </div>

    <div class="hint">
      読み取り後、自動で商品登録画面に戻ります
    </div>
  </div>

</div>

<script>

const APP_URL =
  "https://script.google.com/macros/s/AKfycbwQUeukKCrCf2UQnkI5VantL3EcKG4iMFHWC4QGKTDo35r8NnDSJbOzaSImWered26f/exec";

let scanner = null;
let scanning = false;
let currentScanMode = "register";

let generatedInternalBarcode = "";

function registerWithoutBarcode() {
  window.location.href = APP_URL + "?newBarcode=1";
}

function openRegistration() {
  currentScanMode = "register";
  document.getElementById("scannerTitle").textContent = "商品登録";
  document.getElementById("noBarcodeButton").style.display = "block";
  document.querySelector("#scannerScreen .hint").textContent = "読み取り後、自動で商品登録画面に進みます";
  document.getElementById("homeScreen").classList.remove("active");
  document.getElementById("scannerScreen").classList.add("active");
}

function openSales() {
  currentScanMode = "sale";
  document.getElementById("scannerTitle").textContent = "商品販売";
  document.getElementById("noBarcodeButton").style.display = "none";
  document.querySelector("#scannerScreen .hint").textContent = "読み取り後、商品と数量の確認画面に進みます";
  document.getElementById("homeScreen").classList.remove("active");
  document.getElementById("scannerScreen").classList.add("active");
  // GitHub Pagesのトップレベル画面上で、販売タップを起点に直接カメラを開く。
  startScanner("sale");
}

async function showHome() {
  if (scanner) {
    try { await scanner.stop(); } catch (error) {}
    try { scanner.clear(); } catch (error) {}
    scanner = null;
    scanning = false;
  }
  document.getElementById("scannerScreen").classList.remove("active");
  document.getElementById("homeScreen").classList.add("active");
}

function continueNewProduct() {
  if (!generatedInternalBarcode) return;
  window.location.href = APP_URL + "?barcode=" + encodeURIComponent(generatedInternalBarcode);
}

function printNewBarcode() {
  if (!generatedInternalBarcode) return;
  window.print();
}

async function startScanner(scanMode) {

  if (scanning) return;

  currentScanMode = scanMode || currentScanMode || "register";

  scanning = true;

  document.getElementById("message").textContent =
    "カメラを起動しています…";

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 20,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const width = Math.floor(Math.min(viewfinderWidth * 0.92, 420));
      const height = Math.floor(Math.min(viewfinderHeight * 0.34, 140));
      return { width: width, height: height };
    },
    aspectRatio: 1.777778,
    disableFlip: true,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF
    ],
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    }
  };

  try {

    await scanner.start(
      { facingMode: { exact: "environment" } },
      config,
      onScanSuccess,
      function() {}
    );

    document.getElementById("message").textContent =
      "バーコードを枠内に合わせてください";

  } catch (err) {

    try {

      await scanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        function() {}
      );

      document.getElementById("message").textContent =
        "バーコードを枠内に合わせてください";

    } catch (secondError) {

      scanning = false;

      document.getElementById("message").textContent =
        "カメラを起動できませんでした";

      alert(
        "カメラを起動できませんでした。Safariのカメラ許可を確認してください。"
      );
    }
  }
}


async function onScanSuccess(decodedText) {

  if (!scanning) return;

  scanning = false;

  document.getElementById("message").textContent =
    "✅ 読み取り成功：" + decodedText;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {}

  const destination = currentScanMode === "sale"
    ? APP_URL + "?mode=sale&barcode=" + encodeURIComponent(decodedText)
    : APP_URL + "?barcode=" + encodeURIComponent(decodedText);

  // 読み取り後は待たずに商品登録画面へ移動
  window.location.href = destination;
}

window.addEventListener("DOMContentLoaded", function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("mode") === "sale") {
    openSales();
  }
});

</script>

</body>
</html>
