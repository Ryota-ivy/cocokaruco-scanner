<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>cocokaruco Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-size: 17px;
      font-weight: bold;
    }

    .hint {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>cocokaruco</h1>
  <div class="sub">BARCODE SCANNER</div>

  <button onclick="startScanner()">
    📷 バーコードを読み取る
  </button>

  <div id="reader"></div>

  <div id="message">
    商品のバーコードをカメラに映してください
  </div>

  <div class="hint">
    読み取り後、自動で商品登録画面に戻ります
  </div>

</div>

<script>

const APP_URL =
  "https://script.google.com/macros/s/AKfycbwQUeukKCrCf2UQnkI5VantL3EcKG4iMFHWC4QGKTDo35r8NnDSJbOzaSImWered26f/exec";

let scanner = null;
let scanning = false;

async function startScanner() {

  if (scanning) return;

  scanning = true;

  document.getElementById("message").textContent =
    "カメラを起動しています…";

  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 20,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const width = Math.floor(Math.min(viewfinderWidth * 0.92, 420));
      const height = Math.floor(Math.min(viewfinderHeight * 0.34, 140));
      return { width: width, height: height };
    },
    aspectRatio: 1.777778,
    disableFlip: true,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF
    ],
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    }
  };

  try {

    await scanner.start(
      { facingMode: { exact: "environment" } },
      config,
      onScanSuccess,
      function() {}
    );

    document.getElementById("message").textContent =
      "バーコードを枠内に合わせてください";

  } catch (err) {

    try {

      await scanner.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        function() {}
      );

      document.getElementById("message").textContent =
        "バーコードを枠内に合わせてください";

    } catch (secondError) {

      scanning = false;

      document.getElementById("message").textContent =
        "カメラを起動できませんでした";

      alert(
        "カメラを起動できませんでした。Safariのカメラ許可を確認してください。"
      );
    }
  }
}


async function onScanSuccess(decodedText) {

  if (!scanning) return;

  scanning = false;

  document.getElementById("message").textContent =
    "✅ 読み取り成功：" + decodedText;

  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) {}

  const destination =
    APP_URL + "?barcode=" + encodeURIComponent(decodedText);

  // 読み取り後は待たずに商品登録画面へ移動
  window.location.href = destination;
}

</script>

</body>
</html>
